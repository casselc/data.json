name: Jolt and JVM compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-writer:
    name: Qualified native writer (1ae7e0d)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    env:
      JOLT_AOT_CACHE: '0'
      JOLT_NO_USER_DEPS: '1'
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_RUNTIME_PROFILE: current-0821-1ae7
      QUALIFIED_RUNTIME_RUN_ID: '38618434034'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: 1533b9fe6f7782f4d024a07aefbfb7ce50c4251b
      QUALIFIED_RUNTIME_ARTIFACT_ID: '11921513712'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: 931dda8bf4e9d9beeaa92ad64b8a1c925d3ab670f87414ec9efee9af28cb3537
      QUALIFIED_RUNTIME_BINARY_SHA256: 06a2ccb858c072bfcd74ce94d96eb95f008d75e0fb1f46117728602572189811
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Fetch the authenticated native-capable runtime
        shell: bash
        run: |
          set -euo pipefail
          task_helper="$RUNNER_TEMP/qualified-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 \
            https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/96119103195b67cfc9fd52277251888980fc7852/scripts/fetch-qualified-durable-runtime.sh \
            -o "$task_helper"
          printf '%s  %s\n' 81030fafdb2e3c79765792d043585139f4410c27a281113dd19874b4c27e74b2 "$task_helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 240s bash "$task_helper" > "$RUNNER_TEMP/qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/qualified-runtime.log")" = 1
          task_bin=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/qualified-runtime.log")
          [[ "$task_bin" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$task_bin" && test ! -L "$task_bin"
          test "$(realpath "$task_bin")" = "$task_bin"
          echo "WRITER_JOLT_BIN=$task_bin" >> "$GITHUB_ENV"
      - name: Require native string, live-hook and borrow controls
        run: '"$WRITER_JOLT_BIN" -Srepro -M:jolt-native-test'
      - name: Require byte and segmented writer regression tests
        shell: bash
        run: |
          "$WRITER_JOLT_BIN" -Srepro \
            -Sdeps '{:paths ["src/main/clojure" "src/test/clojure" "src/test/jolt"]}' \
            -e "(println :byte-sorted-segmented-gate :entered) (require 'clojure.data.json-byte-writer-test 'clojure.data.json-sorted-byte-test 'clojure.data.json-segmented-batch-test 'clojure.test) (let [r (clojure.test/run-tests 'clojure.data.json-byte-writer-test 'clojure.data.json-sorted-byte-test 'clojure.data.json-segmented-batch-test)] (assert (= 60 (:test r))) (System/exit (if (zero? (+ (:fail r) (:error r))) 0 1)))"
      - name: Check out exact optional runtime helper source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: casselc/jolt
          ref: fc6d0678c5ee4c563c5db0fc01f27c7c04aa7c2f
          path: .ci/stock-fold-core
          persist-credentials: false
      - name: Require stock-fold consumer controls (explicit source overlay)
        shell: bash
        run: |
          # This tests the exact helper SOURCE on the qualified runtime, not
          # a rebuilt Jolt 0.8.23 artifact. Ordinary absence/fallback ran above.
          "$WRITER_JOLT_BIN" -Srepro \
            -Sdeps '{:paths ["src/main/clojure" "src/test/clojure" "src/test/jolt"]}' \
            -e "(println :stock-fold-source-overlay :entered) (require '[jolt.scheme :as scheme]) (let [source (slurp \".ci/stock-fold-core/host/chez/host-table.ss\") start (.indexOf source \";; Internal native-consumer helpers,\") end (.indexOf source \";; --- extend the collection dispatchers\")] (assert (and (<= 0 start) (< start end))) (scheme/eval-string (subs source start end))) (require 'clojure.data.json-stock-sorted-fold-test 'clojure.data.json-byte-writer-test 'clojure.data.json-sorted-byte-test 'clojure.data.json-segmented-batch-test 'clojure.test) (let [r (clojure.test/run-tests 'clojure.data.json-stock-sorted-fold-test 'clojure.data.json-byte-writer-test 'clojure.data.json-sorted-byte-test 'clojure.data.json-segmented-batch-test)] (assert (= 65 (:test r))) (prn {:gate :stock-fold-source-overlay :complete true}) (System/exit (if (zero? (+ (:fail r) (:error r))) 0 1)))"

  jvm:
    name: JVM Clojure 1.11.4 (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run upstream JVM suite
        run: mvn -ntp -B -Dclojure.version=1.11.4 clean test

  jolt:
    name: Jolt 0.8.3 (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Jolt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6

      - name: Install pinned Jolt 0.8.3
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jolt-v0.8.3-x86_64-linux.tar.gz"
          curl -fsSL \
            https://github.com/jolt-lang/jolt/releases/download/v0.8.3/jolt-v0.8.3-x86_64-linux.tar.gz \
            -o "$archive"
          echo "e567297a6a840d9988a1aa082beb430aeaa0e6610a82a6f9ee0564e117745147  $archive" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jolt"
          tar xzf "$archive" -C "$RUNNER_TEMP/jolt" --strip-components=1
          test -x "$RUNNER_TEMP/jolt/jolt"
          echo "$RUNNER_TEMP/jolt" >> "$GITHUB_PATH"

      - name: Run scalar-indexed String compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          JOLT_PWD="$PWD" jolt -M:jolt-test
